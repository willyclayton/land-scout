<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land Scout</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e3e3e3; --accent:#0a7d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1e; --fg:#f2f2f2; --muted:#a0a0a0; --line:#333; --accent:#3ccf8e; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.4 -apple-system, system-ui, sans-serif; }
  #map { position:fixed; inset:0; }
  .panel { position:absolute; top:10px; left:10px; z-index:2; background:var(--bg);
    border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.25); padding:8px 10px; max-width:calc(100vw - 70px); }
  .panel summary { cursor:pointer; font-weight:600; }
  .panel label { display:block; margin:6px 0; white-space:nowrap; }
  .panel input[type=number] { width:100px; }
  .panel h4 { margin:10px 0 2px; font-size:12px; text-transform:uppercase; color:var(--muted); }
  #sheet { position:absolute; left:0; right:0; bottom:0; z-index:3; background:var(--bg);
    border-radius:14px 14px 0 0; box-shadow:0 -2px 12px rgba(0,0,0,.3);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom)); max-height:65vh; overflow:auto;
    transform:translateY(110%); transition:transform .2s; }
  #sheet.open { transform:none; }
  @media (min-width: 700px) {
    #sheet { left:auto; right:10px; bottom:auto; top:10px; width:360px; border-radius:12px; }
  }
  #sheet h2 { margin:0 28px 2px 0; font-size:20px; }
  #sheet .sub { color:var(--muted); margin-bottom:10px; }
  #close { position:absolute; top:8px; right:10px; border:0; background:none; font-size:24px; color:var(--fg); cursor:pointer; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0 0 12px; }
  dt { color:var(--muted); } dd { margin:0; font-weight:600; }
  .links a { display:inline-block; margin:0 8px 8px 0; padding:6px 10px; border:1px solid var(--line);
    border-radius:8px; color:var(--accent); text-decoration:none; }
  .notes { white-space:pre-wrap; border-top:1px solid var(--line); padding-top:8px; }
  .hist { width:100%; border-collapse:collapse; margin-bottom:12px; font-size:14px; }
  .hist td { padding:3px 6px 3px 0; border-bottom:1px solid var(--line); }
  .hist td:last-child { text-align:right; font-weight:600; }
  dd a { color:var(--accent); }
  h4.sec { margin:14px 0 6px; font-size:12px; text-transform:uppercase; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
</style>
</head>
<body>
<div id="map"></div>

<details class="panel" open>
  <summary>Land Scout · <span id="count">0</span> listings</summary>
  <h4>Map</h4>
  <label><input type="radio" name="base" value="sat" checked> Satellite</label>
  <label><input type="radio" name="base" value="topo"> Topo</label>
  <h4>Layers</h4>
  <label><input type="checkbox" id="lyr-roads" checked> Roads &amp; road names</label>
  <label><input type="checkbox" id="lyr-water" checked> Streams &amp; lakes</label>
  <label><input type="checkbox" id="lyr-places" checked> Towns, peaks &amp; places</label>
  <label><input type="checkbox" id="lyr-public" checked> Public land / forest</label>
  <label><input type="checkbox" id="lyr-bldg" checked> Buildings</label>
  <label><input type="checkbox" id="lyr-contours"> Contour lines</label>
  <label><input type="checkbox" id="lyr-hill" checked> Hillshade</label>
  <label><input type="checkbox" id="lyr-slope"> Slope</label>
  <label><input type="checkbox" id="lyr-flood"> FEMA flood zones</label>
  <div class="hint">Slope: green flat → red steep. Flood: blue/teal = FEMA zones.</div>
  <div class="hint">Tap anywhere for elevation &amp; flood zone.</div>
  <h4>Filters</h4>
  <label>Max price $ <input type="number" id="f-price" step="10000" placeholder="any"></label>
  <label>Min acres <input type="number" id="f-acres" step="0.5" placeholder="any"></label>
  <label>Min beds <input type="number" id="f-beds" step="1" placeholder="any"></label>
  <label><input type="checkbox" id="f-house"> Has a house</label>
  <label>Max days on market <input type="number" id="f-dom" step="10" placeholder="any"></label>
  <label><input type="checkbox" id="f-mine"> Only my listings</label>
  <div class="legend"><span style="background:#e4572e"></span>house <span style="background:#ffc914;margin-left:8px"></span>land only <span style="border:2px solid #3ab0ff;margin-left:8px"></span>mine</div>
  <div class="hint" id="updated"></div>
</details>

<div id="sheet"><button id="close" aria-label="Close">×</button><div id="card"></div></div>

<script>
// ---- Settings -------------------------------------------------------------
const CENTER = [-83.40, 34.88];               // Clayton, GA
const ATL = '33.7816,-84.3830';               // Midtown Atlanta
const QPUBLIC = 'https://qpublic.schneidercorp.com/Application.aspx?App=RabunCountyGA&Layer=Parcels&PageType=Search';

// Live public map services (loaded by your browser, no keys needed)
const esriTile = s => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
const usgsTile = s => `https://basemap.nationalmap.gov/arcgis/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
const BBOX = 'bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&f=image';
const FLOOD = `https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/export?${BBOX}&format=png32&transparent=true&layers=show:28`;
const SLOPE = `https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/exportImage?${BBOX}&format=png&renderingRule=` +
  encodeURIComponent(JSON.stringify({ rasterFunction: 'Slope Map' }));

const CONTOURS = `https://carto.nationalmap.gov/arcgis/rest/services/contours/MapServer/export?${BBOX}&format=png32&transparent=true`;
const OMT = 'https://tiles.openfreemap.org/planet';   // OpenStreetMap vector data, free, no key
const FONT = ['Noto Sans Regular'], FONT_BOLD = ['Noto Sans Bold'];

const raster = (tiles, maxzoom = 19, attribution = '') => ({ type: 'raster', tiles: [tiles], tileSize: 256, maxzoom, attribution });

const map = new maplibregl.Map({
  container: 'map',
  center: CENTER, zoom: 11,
  style: {
    version: 8,
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: {
      sat:   raster(esriTile('World_Imagery'), 19, 'Esri, Maxar'),
      omt:   { type: 'vector', url: OMT, attribution: '© OpenStreetMap' },
      contours: raster(CONTOURS, 17, 'USGS'),
      topo:  raster(usgsTile('USGSTopo'), 16, 'USGS'),
      hill:  raster(usgsTile('USGSShadedReliefOnly'), 16),
      slope: raster(SLOPE, 17, 'USGS 3DEP'),
      flood: raster(FLOOD, 18, 'FEMA NFHL'),
      bounds: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      listings: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    },
    layers: [
      { id: 'sat',   type: 'raster', source: 'sat' },
      { id: 'topo',  type: 'raster', source: 'topo', layout: { visibility: 'none' } },
      { id: 'hill',  type: 'raster', source: 'hill', paint: { 'raster-opacity': 0.35 } },
      // Public land (national forest, parks)
      { id: 'public-fill', type: 'fill', source: 'omt', 'source-layer': 'park',
        paint: { 'fill-color': '#2e9e4f', 'fill-opacity': 0.12 } },
      { id: 'public-line', type: 'line', source: 'omt', 'source-layer': 'park',
        paint: { 'line-color': '#4cd17a', 'line-width': 1.5, 'line-dasharray': [3, 2] } },
      // Water
      { id: 'water-line', type: 'line', source: 'omt', 'source-layer': 'water',
        paint: { 'line-color': '#4fc3ff', 'line-width': 1.2 } },
      { id: 'streams', type: 'line', source: 'omt', 'source-layer': 'waterway',
        paint: { 'line-color': '#4fc3ff', 'line-width': ['match', ['get', 'class'], 'river', 2.5, 1.2] } },
      // Buildings
      { id: 'bldg', type: 'line', source: 'omt', 'source-layer': 'building', minzoom: 14,
        paint: { 'line-color': '#ff9ff3', 'line-width': 1.2 } },
      // Contours
      { id: 'contours', type: 'raster', source: 'contours', minzoom: 12, paint: { 'raster-opacity': 0.8 }, layout: { visibility: 'none' } },
      // Roads
      { id: 'roads', type: 'line', source: 'omt', 'source-layer': 'transportation',
        filter: ['!in', 'class', 'rail', 'transit', 'ferry'],
        paint: {
          'line-color': ['match', ['get', 'class'], ['motorway', 'trunk', 'primary'], '#ffd166', ['secondary', 'tertiary'], '#ffffff', 'track', '#d9b38c', '#e6e6e6'],
          'line-width': ['interpolate', ['linear'], ['zoom'], 10, ['match', ['get', 'class'], ['motorway', 'trunk', 'primary'], 2, 0.6], 16, ['match', ['get', 'class'], ['motorway', 'trunk', 'primary'], 6, 3]],
          'line-opacity': 0.85 } },
      // Labels
      { id: 'stream-names', type: 'symbol', source: 'omt', 'source-layer': 'waterway', minzoom: 12,
        layout: { 'symbol-placement': 'line', 'text-field': ['get', 'name'], 'text-font': FONT, 'text-size': 11 },
        paint: { 'text-color': '#9be0ff', 'text-halo-color': '#000', 'text-halo-width': 1.4 } },
      { id: 'lake-names', type: 'symbol', source: 'omt', 'source-layer': 'water_name',
        layout: { 'text-field': ['get', 'name'], 'text-font': FONT, 'text-size': 13 },
        paint: { 'text-color': '#9be0ff', 'text-halo-color': '#000', 'text-halo-width': 1.4 } },
      { id: 'road-names', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 12,
        layout: { 'symbol-placement': 'line', 'text-field': ['coalesce', ['get', 'name'], ['get', 'ref']], 'text-font': FONT, 'text-size': 11 },
        paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 1.4 } },
      { id: 'public-names', type: 'symbol', source: 'omt', 'source-layer': 'park', minzoom: 9,
        layout: { 'text-field': ['get', 'name'], 'text-font': FONT, 'text-size': 12 },
        paint: { 'text-color': '#8ff0b0', 'text-halo-color': '#000', 'text-halo-width': 1.4 } },
      { id: 'peaks', type: 'symbol', source: 'omt', 'source-layer': 'mountain_peak', minzoom: 11,
        layout: { 'text-field': ['concat', '▲ ', ['get', 'name'], ['case', ['has', 'ele_ft'], ['concat', '\n', ['to-string', ['get', 'ele_ft']], ' ft'], '']],
          'text-font': FONT, 'text-size': 11 },
        paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 1.4 } },
      { id: 'pois', type: 'symbol', source: 'omt', 'source-layer': 'poi', minzoom: 13,
        filter: ['has', 'name'],
        layout: { 'text-field': ['concat', '• ', ['get', 'name']], 'text-font': FONT, 'text-size': 11, 'text-anchor': 'left' },
        paint: { 'text-color': '#ffe08a', 'text-halo-color': '#000', 'text-halo-width': 1.4 } },
      { id: 'towns', type: 'symbol', source: 'omt', 'source-layer': 'place',
        filter: ['in', 'class', 'city', 'town', 'village', 'hamlet'],
        layout: { 'text-field': ['get', 'name'], 'text-font': FONT_BOLD,
          'text-size': ['match', ['get', 'class'], ['city', 'town'], 16, 'village', 13, 11] },
        paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 2 } },
      { id: 'county', type: 'line', source: 'omt', 'source-layer': 'boundary',
        filter: ['<=', 'admin_level', 6],
        paint: { 'line-color': '#fff', 'line-width': 1.5, 'line-dasharray': [4, 2], 'line-opacity': 0.7 } },
      { id: 'slope', type: 'raster', source: 'slope', paint: { 'raster-opacity': 0.55 }, layout: { visibility: 'none' } },
      { id: 'flood', type: 'raster', source: 'flood', paint: { 'raster-opacity': 0.7 }, layout: { visibility: 'none' } },
      { id: 'bounds-fill', type: 'fill', source: 'bounds', paint: { 'fill-color': '#ffc914', 'fill-opacity': 0.15 } },
      { id: 'bounds-line', type: 'line', source: 'bounds', paint: { 'line-color': '#ffc914', 'line-width': 2.5 } },
      { id: 'pts', type: 'circle', source: 'listings', paint: {
        'circle-radius': ['case', ['get', 'mine'], 10, 7], 'circle-stroke-width': ['case', ['get', 'mine'], 3, 1.5],
        'circle-stroke-color': ['case', ['get', 'mine'], '#3ab0ff', '#fff'],
        'circle-color': ['case', ['get', 'house'], '#e4572e', '#ffc914'] } },
      { id: 'pts-label', type: 'symbol', source: 'listings', minzoom: 12,
        layout: { 'text-field': ['get', 'label'], 'text-font': FONT_BOLD, 'text-size': 12, 'text-offset': [0, 1.4] },
        paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 1.5 } },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }));

// ---- Layer toggles ---------------------------------------------------------
const vis = (id, on) => map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
document.querySelectorAll('input[name=base]').forEach(r => r.onchange = () => {
  const sat = r.value === 'sat' && r.checked;
  vis('sat', sat); vis('topo', !sat);
});
const GROUPS = {
  roads: ['roads', 'road-names'],
  water: ['water-line', 'streams', 'stream-names', 'lake-names'],
  places: ['towns', 'peaks', 'pois', 'county'],
  public: ['public-fill', 'public-line', 'public-names'],
  bldg: ['bldg'], contours: ['contours'], hill: ['hill'], slope: ['slope'], flood: ['flood'],
};
for (const [g, ids] of Object.entries(GROUPS)) {
  document.getElementById('lyr-' + g).onchange = e => ids.forEach(id => vis(id, e.target.checked));
}

// ---- Data ------------------------------------------------------------------
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;

let listings = [], boundaries = { type: 'FeatureCollection', features: [] };

async function load() {
  listings = parseCSV(await (await fetch('listings.csv', { cache: 'no-store' })).text())
    .filter(l => num(l.lat) != null && num(l.lng) != null)
    .map(l => {
      for (const k of ['price', 'acres', 'beds', 'baths', 'sqft', 'year_built', 'lat', 'lng', 'drive_min_atl']) l[k] = num(l[k]);
      l.house = l.beds != null || l.sqft != null;
      return l;
    });
  listings.forEach(l => l.mine = true);
  try { boundaries = await (await fetch('boundaries.geojson', { cache: 'no-store' })).json(); } catch (e) {}

  // RentCast pull (written weekly by the GitHub Action). Optional.
  let rc = null;
  try { rc = await (await fetch('rentcast.json', { cache: 'no-store' })).json(); } catch (e) {}
  if (!rc) return;
  updated = rc.updated;
  const byId = new Map(rc.listings.map(r => [r.id, r]));
  const claimed = new Set();
  for (const l of listings) {
    const m = rc.mine?.[l.listing_id];
    if (m?.rentcast_id && byId.has(m.rentcast_id)) { attachRC(l, byId.get(m.rentcast_id)); claimed.add(m.rentcast_id); }
    else if (m?.record) l.record = m.record;
  }
  for (const r of rc.listings) {
    if (claimed.has(r.id)) continue;
    const l = { listing_id: 'rc-' + r.id, source: 'RentCast', mine: false, notes: '', drive_min_atl: null };
    attachRC(l, r); listings.push(l);
  }
}
let updated = null;
// Copy RentCast fields onto a listing, keeping anything you typed by hand.
function attachRC(l, r) {
  l.rc = r; l.record = r.record || l.record;
  for (const [k, v] of Object.entries({ price: r.price, acres: r.acres, beds: r.beds, baths: r.baths, sqft: r.sqft,
    year_built: r.year_built, lat: r.lat, lng: r.lng, address: r.address, status: r.status }))
    if (l[k] == null || l[k] === '') l[k] = v;
  l.house = l.beds != null || l.sqft != null || (r.property_type && !/land/i.test(r.property_type));
}

const pts = list => ({ type: 'FeatureCollection', features: list.map(l => ({
  type: 'Feature', id: listings.indexOf(l),
  properties: { i: listings.indexOf(l), house: !!l.house, mine: !!l.mine, label: l.price ? '$' + Math.round(l.price / 1000) + 'k' : '' },
  geometry: { type: 'Point', coordinates: [l.lng, l.lat] },
})) });

function filtered() {
  const v = id => num(document.getElementById(id).value);
  const maxP = v('f-price'), minA = v('f-acres'), minB = v('f-beds'), maxD = v('f-dom'),
    house = document.getElementById('f-house').checked, mineOnly = document.getElementById('f-mine').checked;
  return listings.filter(l =>
    (maxP == null || (l.price != null && l.price <= maxP)) &&
    (minA == null || (l.acres != null && l.acres >= minA)) &&
    (minB == null || (l.beds != null && l.beds >= minB)) &&
    (maxD == null || (l.rc?.days_on_market != null && l.rc.days_on_market <= maxD)) &&
    (!mineOnly || l.mine) &&
    (!house || l.house));
}

function refresh() {
  if (!map.getSource('listings')) return;
  const list = filtered();
  map.getSource('listings').setData(pts(list));
  const ids = new Set(list.map(l => l.listing_id));
  map.getSource('bounds').setData({ ...boundaries, features: boundaries.features.filter(f => ids.has(String(f.properties.listing_id))) });
  document.getElementById('count').textContent = list.length;
  document.getElementById('updated').textContent = updated ? `Listings from RentCast, updated ${updated}.` : 'No RentCast data yet (see README).';
}
['f-price', 'f-acres', 'f-beds', 'f-house', 'f-dom', 'f-mine'].forEach(id => document.getElementById(id).oninput = refresh);

// ---- Card ------------------------------------------------------------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '—' : '$' + Math.round(n).toLocaleString();
const safeUrl = u => /^https?:\/\//i.test(u) ? u : null;

// ---- Spot info: live lookups for any point -----------------------------------
const CLAYTON = [34.8782, -83.4010];
const ATL_LL = ATL.split(',').map(Number);
function miles([lat1, lng1], [lat2, lng2]) {
  const r = Math.PI / 180, a = Math.sin((lat2 - lat1) * r / 2) ** 2 +
    Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lng2 - lng1) * r / 2) ** 2;
  return 3958.8 * 2 * Math.asin(Math.sqrt(a));
}
async function getJSON(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 12000);
  try { const r = await fetch(url, { signal: ctl.signal }); return await r.json(); } finally { clearTimeout(t); }
}
async function elevationFt(lat, lng) {
  const j = await getJSON(`https://epqs.nationalmap.gov/v1/json?x=${lng}&y=${lat}&wkid=4326&units=Feet&includeDate=false`);
  const v = +j.value; return isFinite(v) && v > -1000 ? `${Math.round(v).toLocaleString()} ft` : '—';
}
async function floodZone(lat, lng) {
  const j = await getJSON('https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28/query?' + new URLSearchParams({
    geometry: `${lng},${lat}`, geometryType: 'esriGeometryPoint', inSR: '4326', spatialRel: 'esriSpatialRelIntersects',
    outFields: 'FLD_ZONE,ZONE_SUBTY', returnGeometry: 'false', f: 'json' }));
  const a = j.features?.[0]?.attributes;
  if (!a) return 'Not in a mapped zone';
  const z = a.FLD_ZONE || '?';
  const risk = /^(A|V)/.test(z) ? 'HIGH RISK' : z === 'X' ? (/0\.2/.test(a.ZONE_SUBTY || '') ? 'moderate' : 'low risk') : '';
  return `Zone ${z}${risk ? ' · ' + risk : ''}`;
}
function nearbyNames(lng, lat) {
  const p = map.project([lng, lat]), box = [[p.x - 40, p.y - 40], [p.x + 40, p.y + 40]];
  const names = (layers, pt) => [...new Set(map.queryRenderedFeatures(pt, { layers: layers.filter(id => map.getLayer(id)) })
    .map(f => f.properties.name || f.properties.ref).filter(Boolean))].slice(0, 3).join(', ');
  return { publicLand: names(['public-fill'], p), roads: names(['roads'], box), water: names(['streams', 'water-line'], box) };
}
let lookupToken = 0;
function siteRows(lat, lng) {
  const near = nearbyNames(lng, lat);
  return [
    ['Elevation', '<span id="s-elev">…</span>', true],
    ['Flood zone', '<span id="s-flood">…</span>', true],
    ['Public land', near.publicLand || 'No (private / unknown)'],
    ['Nearby road', near.roads || '— (zoom in)'],
    ['Nearby water', near.water || '—'],
    ['To Clayton', `${miles([lat, lng], CLAYTON).toFixed(1)} mi straight line`],
    ['To Atlanta', `${miles([lat, lng], ATL_LL).toFixed(0)} mi straight line`],
  ];
}
function fillSite(lat, lng) {
  const tok = ++lookupToken;
  const set = (id, p) => p.then(v => v, () => 'lookup failed').then(v => {
    const el = document.getElementById(id); if (el && tok === lookupToken) el.textContent = v; });
  set('s-elev', elevationFt(lat, lng));
  set('s-flood', floodZone(lat, lng));
}
const dl = rows => `<dl>${rows.map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd>`).join('')}</dl>`;
const linkRow = links => `<div class="links">${links.filter(Boolean).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}</div>`;
const placeLinks = ll => [
  ['Directions to ATL', `https://www.google.com/maps/dir/?api=1&origin=${ll}&destination=${ATL}&travelmode=driving`],
  ['Google Maps', `https://www.google.com/maps/search/?api=1&query=${ll}`],
  ['Street View', `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}`],
  ['County parcel (qPublic)', QPUBLIC],
  ['FEMA flood map', `https://msc.fema.gov/portal/search?AddressQuery=${ll}`],
];

function showSpot(lat, lng) {
  document.getElementById('card').innerHTML = `
    <h2>Spot info</h2>
    <div class="sub">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
    ${dl(siteRows(lat, lng))}
    ${linkRow(placeLinks(`${lat},${lng}`))}`;
  document.getElementById('sheet').classList.add('open');
  fillSite(lat, lng);
}

// Card helpers
function section(title, rows) {
  rows = rows.filter(([, v]) => v != null && v !== '');
  return rows.length ? `<h4 class="sec">${esc(title)}</h4>${dl(rows)}` : '';
}
const telLink = p => `<a href="tel:${esc(p.replace(/[^0-9+]/g, ''))}">${esc(p)}</a>`;
const mailLink = m => `<a href="mailto:${esc(m)}">${esc(m)}</a>`;
function historyTable(h) {
  if (!h?.length) return '';
  return `<h4 class="sec">Price history</h4><table class="hist">${h.map(e =>
    `<tr><td>${esc(e.date)}</td><td>${esc(e.event || '')}</td><td>${esc(money(e.price))}</td></tr>`).join('')}</table>`;
}
function searchLinks(addr) {
  if (!addr || /EXAMPLE/.test(addr)) return [];
  const q = encodeURIComponent(addr);
  return [['Zillow', `https://www.zillow.com/homes/${q}_rb/`], ['Search the web', `https://www.google.com/search?q=${q}`]];
}

function showCard(l) {
  const rows = [
    ['Price', money(l.price)],
    ['Acres', l.acres ?? '—'],
    ['$ / acre', l.price && l.acres ? money(l.price / l.acres) : '—'],
  ];
  if (l.house) rows.push(
    ['Beds / baths', `${l.beds ?? '—'} / ${l.baths ?? '—'}`],
    ['Sq ft', l.sqft ? l.sqft.toLocaleString() : '—'],
    ['$ / sq ft', l.price && l.sqft ? money(l.price / l.sqft) : '—'],
    ['Year built', l.year_built ?? '—'],
  );
  const r = l.rc || {}, rec = l.record || {};
  if (r.property_type) rows.splice(0, 0, ['Type', r.property_type]);
  if (r.lot_sqft) rows.push(['Lot', `${r.lot_sqft.toLocaleString()} sq ft (${r.acres} ac)`]);
  if (r.hoa_fee) rows.push(['HOA', money(r.hoa_fee) + ' / mo']);
  rows.push(['Drive to ATL', l.drive_min_atl ? `${l.drive_min_atl} min` : '— (tap Directions)'], ['Status', l.status || '—']);

  const ll = `${l.lat},${l.lng}`;

  document.getElementById('card').innerHTML = `
    <h2>${esc(l.address || l.listing_id)}</h2>
    <div class="sub">${esc(l.house ? 'House' : 'Land only')} · ${esc(l.source || '')} · ${esc(l.lat.toFixed(5))}, ${esc(l.lng.toFixed(5))}</div>
    ${dl(rows)}
    ${linkRow([safeUrl(l.url) && ['Listing', l.url], ...searchLinks(l.address), ...placeLinks(ll)])}
    ${l.notes ? `<div class="notes">${esc(l.notes)}</div>` : ''}
    ${section('On the market', [
      ['Listed', r.listed_date], ['Days on market', r.days_on_market], ['Listing type', r.listing_type], ['MLS', r.mls]])}
    ${section('Listing agent', [
      ['Agent', r.agent?.name], ['Phone', r.agent?.phone && telLink(r.agent.phone), true], ['Email', r.agent?.email && mailLink(r.agent.email), true],
      ['Office', r.office?.name], ['Office phone', r.office?.phone && telLink(r.office.phone), true]])}
    ${historyTable(r.history)}
    ${section('Tax & sale record', [
      ['Parcel ID', rec.parcel_id], ['Assessed value', rec.assessed_value && `${money(rec.assessed_value)} (${rec.assessed_year})`],
      ['Property tax', rec.annual_tax && `${money(rec.annual_tax)} / yr (${rec.tax_year})`],
      ['Last sold', rec.last_sale_date && `${rec.last_sale_date}${rec.last_sale_price ? ' for ' + money(rec.last_sale_price) : ''}`],
      ['Subdivision', rec.subdivision], ['Zoning', rec.zoning]])}
    ${section('Features', Object.entries(rec.features || {}))}
    <h4 class="sec">The site</h4>
    ${dl(siteRows(l.lat, l.lng))}`;
  document.getElementById('sheet').classList.add('open');
  fillSite(l.lat, l.lng);
}
document.getElementById('close').onclick = () => document.getElementById('sheet').classList.remove('open');

// ---- Wire up ---------------------------------------------------------------
// Start once both the data and the map style are ready, whichever comes last.
let started = false;
const dataReady = load();
function tryStart() {
  if (started || !map.getSource('listings')) return;
  started = true; init();
}
dataReady.then(() => {
  const t = setInterval(() => { tryStart(); if (started) clearInterval(t); }, 150);
  tryStart();
});

function init() {
  map.on('click', 'pts', e => {
    const l = listings[e.features[0].properties.i];
    showCard(l);
    map.easeTo({ center: [l.lng, l.lat], zoom: Math.max(map.getZoom(), 15) });
  });
  map.on('click', 'bounds-fill', e => {
    const l = listings.find(x => x.listing_id === String(e.features[0].properties.listing_id));
    if (l) showCard(l);
  });
  // Tap anywhere else: spot info
  map.on('click', e => {
    const hit = map.queryRenderedFeatures(e.point, { layers: ['pts', 'bounds-fill'] });
    if (!hit.length) showSpot(e.lngLat.lat, e.lngLat.lng);
  });
  for (const id of ['pts', 'bounds-fill']) {
    map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
  }
  refresh();
}
</script>
</body>
