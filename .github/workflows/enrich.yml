name: Pull Rabun listings (RentCast)

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays, ~6-7am Eastern
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write

concurrency: enrich

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          MAX_CALLS: ${{ vars.MAX_CALLS || '10' }}
        run: python pipeline/enrich.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/rentcast.json data/rentcast_cache.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Rabun listings from RentCast"
          git push
      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
